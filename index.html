<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="My GitHub Pages site" />
    <title>Tse-u1107 | Home</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg), #1e293b);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        width: min(720px, 90vw);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        box-shadow: 0 20px 45px rgba(0,0,0,0.35);
        padding: 3rem 2.5rem;
        text-align: center;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        margin: 0 0 1rem;
      }

      p {
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
        margin: 0;
      }

      .badge {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.6rem 1rem;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.12);
        color: var(--accent);
        border: 1px solid rgba(56, 189, 248, 0.25);
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Welcome to my GitHub Pages site</h1>
      <p>
        This is a starter page for <strong>Tse-u1107.github.io</strong>.
        You can replace this content with your portfolio, blog, or project homepage.
      </p>
      <div class="badge">GitHub Pages Ready</div>
    </main>
  </body>
</html>
